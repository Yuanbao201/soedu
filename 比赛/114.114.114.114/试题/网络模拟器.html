<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>网络探秘 · 小互联网仿真器</title>
        <style>
            :root {
                --ink: #1A2E4B;
                --ink-2: #2E4A73;
                --bg: #F0F2F5;
                --paper: #FFFFFF;
                --accent: #E8720C;
                --accent-soft: #FDEBD7;
                --ok: #2E9E5B;
                --ok-soft: #E3F4EA;
                --bad: #D64545;
                --bad-soft: #FBE7E7;
                --muted: #7A8699;
                --line: #D8DEE7;
                --grid: rgba(26,46,75,.07);
            }
            * { box-sizing: border-box; margin: 0; padding: 0; }
            html, body { height: 100%; }
            body {
                font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
                background: var(--bg);
                color: var(--ink);
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }
            
            header {
                background: var(--ink);
                color: #fff;
                padding: 10px 20px;
                display: flex;
                align-items: center;
                gap: 16px;
                flex-wrap: wrap;
                z-index: 5;
            }
            header .logo { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
            header .logo small { font-weight: 400; opacity: .75; font-size: 12px; margin-left: 8px; }
            .hd-group { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
            .hd-group .sep { width: 1px; height: 22px; background: rgba(255,255,255,.25); margin: 0 6px; }
            .btn {
                border: none; border-radius: 8px; padding: 7px 14px;
                font-size: 13px; font-weight: 600; cursor: pointer;
                font-family: inherit; transition: all .12s ease;
            }
            .btn-preset { background: rgba(255,255,255,.14); color: #fff; }
            .btn-preset:hover { background: rgba(255,255,255,.26); }
            .btn-reset { background: rgba(255,255,255,.14); color: #fff; }
            .btn-reset:hover { background: rgba(255,255,255,.26); }
            .mode-switch { display: flex; gap: 4px; background: rgba(255,255,255,.12); border-radius: 8px; padding: 3px; }
            .mode-btn { border: none; background: transparent; color: rgba(255,255,255,.8); font-size: 13px; font-weight: 600; padding: 5px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; }
            .mode-btn.active { background: var(--accent); color: #fff; }
            .btn-demo { background: var(--accent); color: #fff; font-weight: 700; display: none; }
            .btn-demo:hover { background: #d3630a; }
            body.demo-mode .btn-demo { display: inline-block; }
            body.demo-mode .btn-edit { display: none; }
            
            .drag-ghost {
                position: fixed; pointer-events: none; z-index: 999;
                background: var(--paper); border: 2px solid var(--accent);
                border-radius: 10px; padding: 6px 10px;
                display: flex; align-items: center; gap: 6px;
                font-size: 12px; font-weight: 700; color: var(--ink);
                box-shadow: 0 6px 16px rgba(26,46,75,.25); opacity: .92;
            }
            .drag-ghost svg { width: 26px; height: 26px; }
            
            /* 框选矩形 */
            .selection-box {
                position: absolute; z-index: 7;
                border: 1.5px dashed var(--accent);
                background: rgba(232,114,12,.08);
                pointer-events: none; display: none;
            }
            
            /* 介质选择菜单 */
            .kind-menu {
                position: absolute; z-index: 20;
                background: var(--paper); border: 2px solid var(--ink);
                border-radius: 12px; padding: 10px;
                box-shadow: 0 8px 24px rgba(26,46,75,.3);
                display: none;
            }
            .kind-menu.show { display: block; }
            .kind-menu .km-title { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 8px; text-align: center; }
            .kind-menu .km-options { display: flex; gap: 8px; }
            .kind-menu .km-opt {
                border: 2px solid var(--line); background: var(--bg);
                border-radius: 8px; padding: 8px 12px; cursor: pointer;
                font-size: 12px; font-weight: 600; font-family: inherit;
                display: flex; flex-direction: column; align-items: center; gap: 3px;
                transition: all .12s;
            }
            .kind-menu .km-opt:hover { border-color: var(--accent); background: var(--accent-soft); }
            .kind-menu .km-opt .km-line { width: 30px; height: 3px; border-radius: 2px; }
            
            /* 接口标签 */
            .port-label {
                position: absolute; z-index: 3;
                background: var(--ink); color: #fff;
                font-size: 10px; font-weight: 700;
                padding: 2px 6px; border-radius: 4px;
                pointer-events: none; white-space: nowrap;
                transform: translate(-50%, -50%);
            }
            
            /* 右键菜单 */
            .ctx-menu {
                position: absolute; z-index: 30;
                background: var(--paper); border: 2px solid var(--ink);
                border-radius: 10px; padding: 6px;
                box-shadow: 0 8px 24px rgba(26,46,75,.3);
                display: none; min-width: 120px;
            }
            .ctx-menu.show { display: block; }
            .ctx-menu .ctx-item {
                padding: 8px 14px; border-radius: 6px;
                font-size: 13px; font-weight: 600; cursor: pointer;
                display: flex; align-items: center; gap: 6px;
                color: var(--ink);
            }
            .ctx-menu .ctx-item:hover { background: var(--accent-soft); }
            .ctx-menu .ctx-item.danger { color: var(--bad); }
            .ctx-menu .ctx-item.danger:hover { background: var(--bad-soft); }
            .ctx-menu .ctx-item svg { width: 16px; height: 16px; }
            
            /* 点赞动画 */
            .like-popup {
                position: absolute; z-index: 11;
                font-size: 28px; pointer-events: none;
                animation: likeFloat 1.5s ease-out forwards;
            }
            @keyframes likeFloat {
                0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
                30% { opacity: 1; transform: translate(-50%, -80%) scale(1.3); }
                100% { opacity: 0; transform: translate(-50%, -150%) scale(1); }
            }
            
            .steps {
                background: var(--paper); border-bottom: 1px solid var(--line);
                padding: 10px 24px; display: none;
                justify-content: center; gap: 8px; z-index: 4;
            }
            body.demo-mode .steps { display: flex; }
            .step {
                display: flex; align-items: center; gap: 6px;
                font-size: 12px; color: var(--muted);
                padding: 6px 10px; border-radius: 999px;
                border: 2px solid var(--line); background: var(--bg);
                transition: all .2s ease;
            }
            .step .n {
                width: 18px; height: 18px; border-radius: 50%;
                background: var(--muted); color: #fff;
                font-size: 11px; font-weight: 700;
                display: flex; align-items: center; justify-content: center;
            }
            .step.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
            .step.active .n { background: var(--accent); }
            .step.done { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
            .step.done .n { background: var(--ok); }
            
            .main { flex: 1; display: flex; min-height: 0; }
            
            .panel {
                width: 184px; background: var(--paper);
                border-right: 1px solid var(--line);
                padding: 14px 12px; display: flex;
                flex-direction: column; gap: 10px;
                overflow-y: auto; z-index: 4;
            }
            .panel h3 {
                font-size: 12px; color: var(--muted); font-weight: 700;
                letter-spacing: 1px; margin-bottom: 2px;
            }
            .tool-row { display: flex; gap: 6px; flex-wrap: wrap; }
            .tool {
                flex: 1 1 40%; border: 2px solid var(--line);
                background: var(--paper); border-radius: 10px;
                padding: 8px 4px; cursor: pointer;
                display: flex; flex-direction: column;
                align-items: center; gap: 3px;
                font-size: 11px; color: var(--ink); font-weight: 600;
                transition: all .12s ease; font-family: inherit;
            }
            .tool svg { width: 20px; height: 20px; }
            .tool:hover { border-color: var(--accent); }
            .tool.active { border-color: var(--accent); background: var(--accent-soft); }
            .pool-hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
            .device-item {
                border: 2px solid var(--line); background: var(--paper);
                border-radius: 10px; padding: 8px 6px; cursor: grab;
                display: flex; align-items: center; gap: 8px;
                transition: all .12s ease; user-select: none;
            }
            .device-item:hover { border-color: var(--accent); transform: translateX(2px); }
            .device-item:active { cursor: grabbing; }
            .device-item .d-ico { width: 30px; height: 30px; flex: 0 0 30px; pointer-events: none; }
            .device-item .d-info { display: flex; flex-direction: column; pointer-events: none; }
            .device-item .d-name { font-size: 13px; font-weight: 700; }
            .device-item .d-desc { font-size: 10px; color: var(--muted); line-height: 1.3; }
            
            .stage-wrap { flex: 1; position: relative; min-width: 0; }
            .stage {
                position: absolute; inset: 0;
                background-color: #FAFBFD;
                background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
                background-size: 36px 36px;
                overflow: hidden; cursor: default;
            }
            .stage.drag-over { box-shadow: inset 0 0 0 3px var(--accent); }
            .zone {
                position: absolute; border: 2px dashed rgba(26,46,75,.25);
                border-radius: 16px; pointer-events: none; z-index: 0;
            }
            
            svg.links {
                position: absolute; inset: 0; width: 100%; height: 100%;
                pointer-events: none; z-index: 1;
            }
            svg.links line {
                stroke: var(--ink-2); stroke-width: 3;
                stroke-linecap: round; transition: stroke .2s ease;
                pointer-events: stroke; cursor: pointer;
            }
            svg.links line.hit-area {
                stroke: transparent; stroke-width: 14;
                pointer-events: stroke; cursor: pointer;
            }
            svg.links text {
                pointer-events: auto; cursor: pointer;
            }
            svg.links line.ok { stroke: var(--ok); }
            svg.links line.bad { stroke: var(--bad); }
            svg.links line.selected { stroke: var(--accent); stroke-width: 4; }
            svg.links line.wifi { stroke-dasharray: 7 5; }
            svg.links line.fiber { stroke-width: 4; stroke: var(--accent); }
            
            .dev {
                position: absolute; width: 92px; min-height: 72px;
                transform: translate(-50%, -50%);
                background: var(--paper); border: 2px solid var(--ink-2);
                border-radius: 12px; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 2px;
                cursor: grab; user-select: none;
                box-shadow: 0 2px 6px rgba(26,46,75,.12);
                transition: border-color .15s ease, box-shadow .15s ease;
                z-index: 2; padding: 6px 4px;
            }
            .dev:hover { box-shadow: 0 4px 12px rgba(26,46,75,.2); }
            .dev .d-ico { width: 34px; height: 34px; pointer-events: none; }
            .dev .d-name { font-size: 11px; font-weight: 700; text-align: center; line-height: 1.2; pointer-events: none; }
            .dev .d-ip { font-size: 9px; color: var(--muted); text-align: center; line-height: 1.2; pointer-events: none; }
            .dev .d-addr { font-size: 11px; color: var(--accent); font-weight: 700; text-align: center; line-height: 1.2; pointer-events: none; font-family: "SF Mono", Consolas, monospace; }
            .dev .edit-pencil {
                display: inline-flex; align-items: center; justify-content: center;
                width: 12px; height: 12px; margin-left: 3px;
                cursor: pointer; z-index: 5; pointer-events: auto;
                vertical-align: middle; flex: 0 0 12px;
                opacity: .4; transition: opacity .15s;
            }
            .dev .edit-pencil svg { width: 12px; height: 12px; color: var(--muted); display: block; }
            .dev .edit-pencil:hover { opacity: 1; }
            .dev.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); z-index: 3; }
            .dev.flash-ok { border-color: var(--ok); box-shadow: 0 0 0 4px rgba(46,158,91,.35); }
            .dev.flash-bad { border-color: var(--bad); box-shadow: 0 0 0 4px rgba(214,69,69,.35); }
            .dev.internet { border-style: dashed; background: var(--ink); }
            .dev.internet .d-name { color: #fff; }
            .dev.internet .d-ip { color: rgba(255,255,255,.65); }
            .dev.dragging { cursor: grabbing; z-index: 6; }
            .dev.server { border-color: var(--ok); }
            
            .dev.dev-zone {
                width: 340px; height: 260px;
                border: 2.5px dashed rgba(26,46,75,.55);
                background: rgba(26,46,75,.04); border-radius: 16px;
                cursor: move; box-shadow: none; padding: 0; gap: 0; z-index: 1;
            }
            .dev.dev-zone:hover { box-shadow: 0 0 0 3px rgba(232,114,12,.18); }
            .dev.dev-zone.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,114,12,.22); }
            .dev.dev-zone .zone-tag {
                position: absolute; top: 14px; left: 16px;
                background: var(--ink); color: #fff;
                font-size: 12px; font-weight: 700;
                padding: 3px 14px; border-radius: 999px;
                letter-spacing: 1px; pointer-events: none;
                max-width: calc(100% - 32px); white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis;
            }
            .dev.dev-zone .zone-size {
                position: absolute; bottom: 8px; right: 12px;
                font-size: 10px; color: var(--muted); pointer-events: none;
            }
            .dev.dev-zone .resize-handle {
                position: absolute; right: -9px; bottom: -9px;
                width: 20px; height: 20px; background: var(--accent);
                border: 2px solid #fff; border-radius: 6px;
                cursor: nwse-resize; box-shadow: 0 2px 6px rgba(232,114,12,.4); z-index: 3;
            }
            .dev.dev-zone .resize-handle::after {
                content: ''; position: absolute; right: 4px; bottom: 4px;
                width: 7px; height: 7px;
                border-right: 2.5px solid #fff; border-bottom: 2.5px solid #fff;
                border-bottom-right-radius: 1px;
            }
            
            .bubble {
                position: absolute; z-index: 9;
                background: var(--ink); color: #fff;
                font-size: 13px; line-height: 1.5;
                padding: 10px 14px; border-radius: 10px;
                max-width: 300px; pointer-events: none;
                opacity: 0; transform: translateY(6px);
                transition: opacity .2s ease, transform .2s ease;
                box-shadow: 0 6px 16px rgba(26,46,75,.25);
            }
            .bubble.show { opacity: 1; transform: translateY(0); }
            .bubble::after {
                content: ''; position: absolute; top: 100%; left: var(--ax, 50%);
                transform: translateX(-50%);
                border: 7px solid transparent; border-top-color: var(--ink);
            }
            .bubble.below::after {
                top: auto; bottom: 100%;
                border-top-color: transparent; border-bottom-color: var(--ink);
            }
            .bubble b { color: #FFB27A; }
            
            .packet-card {
                position: absolute; z-index: 8;
                background: var(--accent-soft); border: 2px solid var(--accent);
                border-radius: 10px; padding: 8px 12px;
                font-size: 12px; line-height: 1.6; color: var(--ink);
                pointer-events: none; opacity: 0; transform: scale(.92);
                transition: opacity .2s ease, transform .2s ease;
                box-shadow: 0 4px 12px rgba(232,114,12,.25);
            }
            .packet-card.show { opacity: 1; transform: scale(1); }
            .packet-card .p-label { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: 1px; }
            .packet-card .p-ip { font-weight: 700; }
            
            .site-panel {
                position: absolute; z-index: 10; left: 50%; top: 50%;
                transform: translate(-50%, -50%);
                background: var(--paper); border: 2px solid var(--ink);
                border-radius: 16px; padding: 20px 24px;
                box-shadow: 0 12px 40px rgba(26,46,75,.3);
                text-align: center; display: none;
            }
            .site-panel.show { display: block; }
            .site-panel h3 { font-size: 17px; margin-bottom: 4px; }
            .site-panel .sp-sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
            .site-list { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
            .site-btn {
                border: 2px solid var(--line); background: var(--bg);
                border-radius: 12px; padding: 12px 18px; cursor: pointer;
                display: flex; flex-direction: column; align-items: center; gap: 3px;
                font-family: inherit; transition: all .12s ease;
            }
            .site-btn:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-2px); }
            .site-btn .s-name { font-size: 15px; font-weight: 700; color: var(--ink); }
            .site-btn .s-url { font-size: 12px; color: var(--muted); }
            .site-close {
                margin-top: 12px; border: none; background: none;
                color: var(--muted); font-size: 13px; cursor: pointer; font-family: inherit;
            }
            .site-close:hover { color: var(--ink); }
            
            .proc-note {
                position: absolute; z-index: 9; left: 50%; top: 16px;
                transform: translateX(-50%);
                background: var(--paper); border: 2px solid var(--accent);
                color: var(--ink); font-size: 14px; font-weight: 600;
                padding: 8px 18px; border-radius: 999px;
                box-shadow: 0 4px 14px rgba(232,114,12,.2);
                display: none; white-space: nowrap; max-width: 90%;
            }
            .proc-note.show { display: block; }
            .proc-note b { color: var(--accent); }
            
            .rt-panel {
                position: absolute; z-index: 9;
                background: var(--paper); border: 2px solid var(--ink);
                border-radius: 12px; padding: 10px 12px;
                box-shadow: 0 8px 24px rgba(26,46,75,.25);
                display: none; font-size: 12px;
                width: 380px; max-width: calc(100% - 24px);
            }
            .rt-panel.show { display: block; }
            .rt-panel h4 { font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
            .rt-panel h4 .rt-ico { color: var(--accent); }
            .rt-table { border-collapse: collapse; width: 100%; table-layout: fixed; }
            .rt-table th, .rt-table td { border: 1px solid var(--line); padding: 5px 6px; text-align: left; font-size: 11.5px; word-break: break-all; }
            .rt-table th:first-child { width: 56%; }
            .rt-table th:nth-child(2) { width: 26%; }
            .rt-table th { background: var(--ink); color: #fff; font-weight: 600; }
            .rt-table tr.match td { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
            .rt-panel .rt-note { margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.5; }
            
            .webpage {
                position: absolute; z-index: 12; width: 300px;
                background: var(--paper); border: 2px solid var(--ink);
                border-radius: 12px; box-shadow: 0 12px 40px rgba(26,46,75,.35);
                overflow: hidden; display: none;
            }
            .webpage.show { display: block; }
            .webpage .wp-bar {
                background: var(--bg); border-bottom: 1px solid var(--line);
                padding: 8px 12px; font-size: 12px; color: var(--muted);
                display: flex; align-items: center; gap: 8px;
            }
            .webpage .wp-bar .wp-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
            .webpage .wp-bar .wp-url { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; font-size: 11px; flex: 1; }
            .webpage .wp-body { padding: 18px 20px; text-align: center; }
            .webpage .wp-logo { font-size: 26px; font-weight: 800; color: #4E6EF2; letter-spacing: 2px; margin-bottom: 12px; }
            .webpage .wp-search { display: flex; border: 2px solid #4E6EF2; border-radius: 8px; overflow: hidden; }
            .webpage .wp-search input { flex: 1; border: none; outline: none; padding: 8px 10px; font-size: 13px; font-family: inherit; }
            .webpage .wp-search button { border: none; background: #4E6EF2; color: #fff; padding: 8px 16px; font-size: 13px; cursor: pointer; font-family: inherit; }
            .webpage .wp-tip { margin-top: 10px; font-size: 12px; color: var(--muted); }
            
            footer {
                background: var(--paper); border-top: 1px solid var(--line);
                padding: 8px 20px; display: flex; align-items: center;
                gap: 12px; min-height: 44px; z-index: 5;
            }
            .status { font-size: 13px; color: var(--muted); line-height: 1.5; flex: 1; }
            .status b { color: var(--ink); }
            .toast {
                margin-left: auto; border-radius: 10px; padding: 8px 16px;
                font-size: 13px; font-weight: 600; max-width: 60%;
                text-align: center; line-height: 1.5; display: none;
            }
            .toast.show { display: block; }
            .toast.ok { background: var(--ok-soft); color: var(--ok); }
            .toast.bad { background: var(--bad-soft); color: var(--bad); }
            .toast.info { background: var(--accent-soft); color: var(--accent); }
            .btn-next {
                border: none; border-radius: 10px; padding: 10px 26px;
                font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
                background: var(--accent); color: #fff;
                transition: all .12s ease; display: none;
            }
            .btn-next:hover { background: #d3630a; }
            .btn-next:disabled { opacity: .5; cursor: not-allowed; }
            body.demo-mode .btn-next { display: inline-block; }
            .btn-prev {
                border: none; border-radius: 10px; padding: 10px 22px;
                font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
                background: var(--ink-2); color: #fff;
                transition: all .12s ease; display: none;
            }
            .btn-prev:hover { background: #1f3a5f; }
            .btn-prev:disabled { opacity: .5; cursor: not-allowed; }
            body.demo-mode .btn-prev { display: inline-block; }
            
            @media (max-width: 720px) {
                .main { flex-direction: column; }
                .panel { width: 100%; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--line); }
                .panel h3 { display: none; }
                .device-item { padding: 6px 8px; }
                .steps { flex-wrap: wrap; }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="logo">小互联网仿真器<small>第3课 · 点击链接后发生了什么</small></div>
            <div class="hd-group">
                <div class="mode-switch">
                    <button class="mode-btn active" id="modeBuild">搭建模式</button>
                    <button class="mode-btn" id="modeDemo">演示模式</button>
                    <button class="mode-btn" id="modeComm">通信模式</button>
                </div>
                <span class="sep"></span>
                <button class="btn btn-demo" id="btnDemoPlay">开始演示</button>
                <span class="sep"></span>

        <script>
            (function () {
                'use strict';
                
                /* ===== 设备定义 ===== */
                var DEVICES = {
                    pc: { name: '电脑', desc: '发送和接收信息',
                    icon: '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="8" width="32" height="22" rx="2.5" fill="#2E4A73"/><rect x="11" y="11" width="26" height="16" rx="1.5" fill="#D8E3F2"/><rect x="18" y="33" width="12" height="3" rx="1.5" fill="#7A8699"/><rect x="15" y="36" width="18" height="3" rx="1.5" fill="#7A8699"/></svg>' },
                    phone: { name: '手机', desc: '无线设备，连WiFi上网',

                    switch: { name: '交换机', desc: '把多台设备连成局域网',
                    icon: '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="15" width="36" height="20" rx="3" fill="#2E4A73"/><circle cx="12" cy="25" r="2.6" fill="#E8720C"/><circle cx="20" cy="25" r="2.6" fill="#E8720C"/><circle cx="28" cy="25" r="2.6" fill="#E8720C"/><circle cx="36" cy="25" r="2.6" fill="#E8720C"/><rect x="15" y="38" width="18" height="3" rx="1.5" fill="#7A8699"/></svg>' },
                    router: { name: '路由器', desc: '连接不同网络，具有3个LAN口',
                    icon: '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="20" width="32" height="15" rx="3" fill="#1A2E4B"/><line x1="15" y1="7" x2="15" y2="19" stroke="#1A2E4B" stroke-width="3.5" stroke-linecap="round"/><line x1="33" y1="7" x2="33" y2="19" stroke="#1A2E4B" stroke-width="3.5" stroke-linecap="round"/><circle cx="15" cy="5.5" r="2.2" fill="#E8720C"/><circle cx="33" cy="5.5" r="2.2" fill="#E8720C"/><circle cx="13" cy="27" r="2.2" fill="#E8720C"/><circle cx="35" cy="27" r="2.2" fill="#E8720C"/></svg>' },
                    ap: { name: '无线AP', desc: '发射WiFi信号，接在交换机或路由器上',
                    icon: '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="22" width="24" height="14" rx="3" fill="#2E4A73"/><path d="M18 20c2-3 5-4.5 6-4.5s4 1.5 6 4.5" stroke="#E8720C" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M15 16c3-4.5 7-6.5 9-6.5s6 2 9 6.5" stroke="#E8720C" stroke-width="2.2" stroke-linecap="round" fill="none"/><circle cx="24" cy="12" r="2.5" fill="#E8720C"/><rect x="18" y="30" width="12" height="2.5" rx="1" fill="#D8E3F2"/></svg>' },
                    modem: { name: '光猫', desc: '把光信号变成电信号',
                    icon: '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="18" width="36" height="14" rx="2.5" fill="#2E4A73"/><circle cx="12" cy="25" r="2" fill="#2E9E5B"/><circle cx="19" cy="25" r="2" fill="#E8720C"/><circle cx="26" cy="25" r="2" fill="#E8720C"/><rect x="8" y="15" width="8" height="3" rx="1" fill="#7A8699"/><line x1="36" y1="34" x2="36" y2="39" stroke="#E8720C" stroke-width="2"/><circle cx="36" cy="41.5" r="2.5" fill="#E8720C"/></svg>' },
                    dns: { name: 'DNS服务器', desc: '互联网电话簿',
                    icon: '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="28" height="28" rx="4" fill="#1A2E4B"/><rect x="15" y="15" width="18" height="4" rx="1" fill="#E8720C"/><rect x="15" y="22" width="18" height="4" rx="1" fill="#E8720C"/><rect x="15" y="29" width="12" height="4" rx="1" fill="#E8720C"/></svg>' },
                    web: { name: 'Web服务器', desc: '存放网页，收到请求就发送',
                    icon: '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="28" height="28" rx="4" fill="#1A2E4B"/><circle cx="24" cy="24" r="6" fill="#E8720C"/><path d="M15 15h18M15 22h18M15 29h18" stroke="#E8720C" stroke-width="2" stroke-linecap="round" opacity=".7"/></svg>' },
                    internet: { name: '互联网', desc: '外面的大千世界',
                    icon: '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 35a9 9 0 1 1 1.5-17.9A12 12 0 0 1 39 22.5 7.5 7.5 0 0 1 36 35H15z" fill="#FFFFFF" opacity=".9"/><path d="M20 29l4.5-5 3.8 3.8 3-4.5" stroke="#2E4A73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
                    zone: { name: '区域框', desc: '拖到画布上，划分一个区域',
                    icon: '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="6" width="36" height="36" rx="5" stroke="#E8720C" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M8 16h6M8 25h4" stroke="#E8720C" stroke-width="2" stroke-linecap="round"/></svg>' }
                };
                
                /* 各模式的设备库 */
                var MODE_DEVICES = {
                    build: ['zone', 'pc', 'phone', 'tablet', 'switch', 'router', 'ap', 'modem', 'internet'],
                    demo: [],
                    comm: ['zone', 'pc', 'switch', 'router']
                };
                
                /* 各模式的工具 */
                var MODE_TOOLS = {
                    build: ['select', 'connect', 'send'],
                    demo: ['select'],
                    comm: ['select', 'connect', 'like']
                };
                
                var SITES = [
                { name: '百度', url: 'www.baidu.com', ip: '110.242.68.66' },
                { name: '哔哩哔哩', url: 'www.bilibili.com', ip: '134.175.47.77' },
                { name: '淘宝', url: 'www.taobao.com', ip: '140.205.144.11' }
                ];
                
                /* ===== 状态 ===== */
                var state = {
                    mode: 'build',
                    tool: 'select',
                    devices: [],
                    links: [],
                    nextId: 1,
                    connectFrom: null,
                    sendRunning: false,
                    demoStep: 0,
                    demoPlaying: false,
                    selection: [],       // 多选的设备id
                    selectedLinkId: null,
                    pendingKindLink: null // 等待选择介质的连线
                };
                
                var els = {};
                var svgNS = 'http://www.w3.org/2000/svg';
                var pendingPcId = null;
                
                /* ===== 初始化 ===== */
                function init() {
                    els.stage = document.getElementById('stage');
                    els.linksSvg = document.getElementById('linksSvg');
                    els.status = document.getElementById('status');
                    els.toast = document.getElementById('toast');
                    els.deviceList = document.getElementById('deviceList');
                    els.procNote = document.getElementById('procNote');
                    els.packetCard = document.getElementById('packetCard');
                    els.bubble = document.getElementById('bubble');
                    els.rtPanel = document.getElementById('rtPanel');
                    els.webpage = document.getElementById('webpage');
                    els.sitePanel = document.getElementById('sitePanel');
                    els.siteList = document.getElementById('siteList');
                    els.siteClose = document.getElementById('siteClose');
                    els.targetPanel = document.getElementById('targetPanel');
                    els.targetList = document.getElementById('targetList');
                    els.targetClose = document.getElementById('targetClose');
                    els.btnNext = document.getElementById('btnNext');
                    els.btnPrev = document.getElementById('btnPrev');
                    els.selectionBox = document.getElementById('selectionBox');
                    els.kindMenu = document.getElementById('kindMenu');
                    els.ctxMenu = document.getElementById('ctxMenu');
                    els.ctxDelete = document.getElementById('ctxDelete');
                    els.ctxEdit = document.getElementById('ctxEdit');
                    els.poolHint = document.getElementById('poolHint');
                    
                    renderSiteList();
                    bindTools();
                    bindTopbar();
                    bindStage();
                    bindPoolDrag();
                    bindResize();
                    bindKeyboard();
                    bindKindMenu();
                    bindWindowResize();
                    
                    els.linksSvg.addEventListener('click', function (e) {
                        var hit = e.target.closest('[data-link]');
                        if (!hit) return;
                        var lid = Number(hit.getAttribute('data-link'));
                        selectLink(lid);
                    });
                    
                    els.siteClose.addEventListener('click', closeSitePanel);
                    els.targetClose.addEventListener('click', closeTargetPanel);
                    
                    loadBuildScene();
                    setTool('select');
                    updateToolVisibility();
                    renderDeviceList();
                }
                
                /* ===== 窗口自适应 ===== */
                function bindWindowResize() {
                    var resizeTimer;
                    window.addEventListener('resize', function () {
                        clearTimeout(resizeTimer);
                        resizeTimer = setTimeout(function () {
                            renderLinks();
                            renderPortLabels();
                        }, 150);
                    });
                }
                
                function renderSiteList() {
                    els.siteList.innerHTML = '';
                    SITES.forEach(function (s) {
                        var btn = document.createElement('button');
                        btn.className = 'site-btn';
                        btn.innerHTML = '<span class="s-name">' + s.name + '</span><span class="s-url">' + s.url + '</span>';
                        btn.addEventListener('click', function () { startVisit(s); });
                        els.siteList.appendChild(btn);
                    });
                }
                
                function renderDeviceList() {
                    var order = MODE_DEVICES[state.mode] || [];
                    els.deviceList.innerHTML = '';
                    order.forEach(function (t) {
                        var d = DEVICES[t];
                        var item = document.createElement('div');
                        item.className = 'device-item';
                        item.dataset.type = t;
                        item.innerHTML = '<div class="d-ico">' + d.icon + '</div><div class="d-info"><div class="d-name">' + d.name + '</div><div class="d-desc">' + d.desc + '</div></div>';
                        els.deviceList.appendChild(item);
                    });
                    bindPoolDrag();
                }
                
                /* 工具按钮显隐 */
                function updateToolVisibility() {
                    var tools = MODE_TOOLS[state.mode] || [];
                    document.querySelectorAll('.tool').forEach(function (b) {
                        var t = b.dataset.tool;
                        var show = tools.indexOf(t) !== -1;
                        b.style.display = show ? '' : 'none';
                        if (!show && state.tool === t) setTool('select');
                    });
                }
                
                /* 从设备库拖到画布 */
                function bindPoolDrag() {
                    els.deviceList.querySelectorAll('.device-item').forEach(function (item) {
                        item.addEventListener('pointerdown', function (e) {
                            if (state.mode === 'demo') return;
                            e.preventDefault();
                            var type = item.dataset.type;
                            var ghost = document.createElement('div');
                            ghost.className = 'drag-ghost';
                            ghost.innerHTML = DEVICES[type].icon + '<span>' + DEVICES[type].name + '</span>';
                            document.body.appendChild(ghost);
                            ghost.style.left = (e.clientX - 46) + 'px';
                            ghost.style.top = (e.clientY - 28) + 'px';
                            
                            function onMove(ev) {
                                ghost.style.left = (ev.clientX - 46) + 'px';
                                ghost.style.top = (ev.clientY - 28) + 'px';
                            }
                            function onUp(ev) {
                                document.removeEventListener('pointermove', onMove);
                                document.removeEventListener('pointerup', onUp);
                                document.removeEventListener('pointercancel', onUp);
                                ghost.remove();
                                var rect = els.stage.getBoundingClientRect();
                                var inStage = ev.clientX >= rect.left && ev.clientX <= rect.right &&
                                ev.clientY >= rect.top && ev.clientY <= rect.bottom;
                                if (!inStage) { setStatus('拖到画布上再松手，才能放置设备。'); return; }
                                if (type === 'internet' && state.devices.some(function (d) { return d.type === 'internet'; })) {
                                    showToast('info', '互联网只有一个，画布上已经有了。'); return;
                                }
                                var x = ev.clientX - rect.left;
                                var y = ev.clientY - rect.top;
                                if (type === 'zone') {
                                    state.devices.push({ id: state.nextId++, type: 'zone', x: Math.round(x), y: Math.round(y), w: 340, h: 260, label: '区域' });
                                    renderAll();
                                    showToast('ok', '已放置区域框，双击它可以给区域起名字。');
                                    return;
                                }
                                var newDev = { id: state.nextId++, type: type, x: Math.round(x), y: Math.round(y) };
                                state.devices.push(newDev);
                                renderAll();
                                showToast('info', '已放置【' + DEVICES[type].name + '】，继续拖别的设备吧。');
                            }
                            document.addEventListener('pointermove', onMove);
                            document.addEventListener('pointerup', onUp);
                            document.addEventListener('pointercancel', onUp);
                        });
                    });
                }
                
                /* ===== 顶部按钮 ===== */
                function bindTopbar() {
                    document.getElementById('modeBuild').addEventListener('click', function () { switchMode('build'); });
                    document.getElementById('modeDemo').addEventListener('click', function () { switchMode('demo'); });
                    document.getElementById('modeComm').addEventListener('click', function () { switchMode('comm'); });
                    document.getElementById('btnClear').addEventListener('click', function () {
                        if (state.mode === 'demo') { switchMode('build'); return; }
                        clearScene();
                    });
                    document.getElementById('btnNew').addEventListener('click', function () {
                        if (state.mode === 'demo') { switchMode('build'); }
                        clearScene();
                        setStatus('空白画布已就绪：从左侧设备库把设备拖到画布上，搭好你的网络模型。');
                        showToast('info', '新建空白模型，开始搭建吧。');
                    });
                    document.getElementById('btnSave').addEventListener('click', saveModel);
                    document.getElementById('btnImport').addEventListener('click', importModel);
                    document.getElementById('btnDemoPlay').addEventListener('click', startDemo);
                }
                
                /* ===== 模型管理 ===== */
                function saveModel() {
                    if (state.mode === 'demo') { showToast('info', '请先切回搭建或通信模式，再保存模型。'); return; }
                    if (state.devices.length === 0) { showToast('info', '画布还是空的，先搭一些设备再保存吧。'); return; }
                    var data = {
                        version: 2, mode: state.mode, savedAt: new Date().toISOString(),
                        devices: state.devices.map(function (d) {
                            return { id: d.id, type: d.type, x: d.x, y: d.y, ip: d.ip || '', label: d.label || '', w: d.w || 0, h: d.h || 0, addr: d.addr || '' };
                        }),
                        links: state.links.map(function (l) {
                            return { id: l.id, a: l.a, b: l.b, kind: l.kind, portA: l.portA || 0, portB: l.portB || 0 };
                        }),
                        nextId: state.nextId
                    };
                    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url; a.download = '网络模型-' + Date.now() + '.json';
                    document.body.appendChild(a); a.click(); a.remove();
                    URL.revokeObjectURL(url);
                    showToast('ok', '模型已保存为 .json 文件，下次点"导入模型"即可继续编辑。');
                }
                
                function importModel() {
                    if (state.mode === 'demo') switchMode('build');
                    var input = document.createElement('input');
                    input.type = 'file'; input.accept = '.json,application/json';
                    input.addEventListener('change', function () {
                        var file = input.files[0]; if (!file) return;
                        var reader = new FileReader();
                        reader.onload = function () {
                            try {
                                var data = JSON.parse(reader.result);
                                if (!data.devices || !Array.isArray(data.devices)) throw new Error('bad format');
                                var validTypes = Object.keys(DEVICES);
                                var devices = [];
                                data.devices.forEach(function (d) {
                                    if (validTypes.indexOf(d.type) === -1) return;
                                    devices.push({
                                        id: Number(d.id), type: d.type, x: Number(d.x), y: Number(d.y),
                                        ip: d.ip ? String(d.ip) : undefined, label: d.label ? String(d.label) : undefined,
                                        w: d.w ? Number(d.w) : undefined, h: d.h ? Number(d.h) : undefined,
                                        addr: d.addr ? String(d.addr) : undefined
                                    });
                                });
                                if (devices.length === 0) throw new Error('no devices');
                                var links = [];
                                (data.links || []).forEach(function (l) {
                                    links.push({ id: Number(l.id), a: Number(l.a), b: Number(l.b), kind: l.kind || 'wire', portA: l.portA || 0, portB: l.portB || 0 });
                                });
                                var maxId = 0;
                                devices.forEach(function (d) { if (d.id > maxId) maxId = d.id; });
                                links.forEach(function (l) { if (l.id > maxId) maxId = l.id; });
                                state.devices = devices; state.links = links;
                                state.nextId = data.nextId > maxId ? Number(data.nextId) : maxId + 1;
                                state.connectFrom = null; state.sendRunning = false;
                                state.selection = []; state.selectedLinkId = null;
                                clearOverlays(); clearDeviceDom(); renderAll();
                                setTool('select');
                                if (data.mode === 'comm') switchMode('comm');
                                setStatus('模型已导入：共 ' + state.devices.length + ' 台设备、' + state.links.length + ' 条连线，可以继续编辑。');
                                showToast('ok', '导入成功，继续搭建吧！');
                            } catch (err) {
                                showToast('bad', '文件格式不对，请选择本工具保存的 .json 模型文件。');
                            }
                        };
                        reader.readAsText(file);
                    });
                    input.click();
                }
                
                function switchMode(m) {
                    state.mode = m;
                    document.getElementById('modeBuild').classList.toggle('active', m === 'build');
                    document.getElementById('modeDemo').classList.toggle('active', m === 'demo');
                    document.getElementById('modeComm').classList.toggle('active', m === 'comm');
                    document.body.classList.toggle('demo-mode', m === 'demo');
                    clearOverlays(); hideRtPanel(); setSteps(0);
                    state.demoStep = 0; state.selection = []; state.selectedLinkId = null;
                    els.btnNext.disabled = false; els.btnPrev.disabled = false;
                    updateToolVisibility();
                    renderDeviceList();
                    if (m === 'demo') {
                        loadDemoScene();
                        setTool('select');
                        setStatus('演示模式：网络已经搭好，点顶部橙色"开始演示"，再一步步点"下一步"观看寻址过程。');
                        showToast('info', '点顶部"开始演示"，然后跟着"下一步"走。');
                    } else if (m === 'comm') {
                        loadCommScene();
                        setTool('select');
                        els.poolHint.textContent = '拖入电脑、交换机、路由器搭建网络；双击电脑设置编号；连线后路由器自动分配接口号';
                    } else {
                        loadBuildScene();
                        setTool('select');
                        els.poolHint.textContent = '先拖"区域框"划分区域，再拖设备摆放连线';
                    }
                }
                
                /* ===== 工具 ===== */
                function bindTools() {
                    document.querySelectorAll('.tool').forEach(function (b) {
                        b.addEventListener('click', function () { setTool(b.dataset.tool); });
                    });
                }
                
                function setTool(t) {
                    state.tool = t;
                    state.connectFrom = null;
                    state.selection = [];
                    state.selectedLinkId = null;
                    document.querySelectorAll('.tool').forEach(function (b) {
                        b.classList.toggle('active', b.dataset.tool === t);
                    });
                    document.querySelectorAll('.dev').forEach(function (d) { d.classList.remove('selected'); });
                    document.querySelectorAll('svg.links line').forEach(function (l) { l.classList.remove('selected'); });
                    if (state.mode === 'demo' && t !== 'select') {
                        setStatus('演示模式中只能查看，切换回"搭建模式"才能动手连线。'); return;
                    }
                    if (t === 'select') {
                        setStatus('选择模式：拖动设备可移动；按住空白处拖拽可框选多个设备；选中后按 Delete 或右键删除。（双击设备可改名/设编号）');
                    } else if (t === 'connect') {
                        setStatus('连线模式：先点一台设备，再点另一台，连好后选择介质（网线/WiFi/光纤）。');
                    } else if (t === 'send') {
                        setStatus('上网模式：点击一台电脑 / 手机 / 平板，选一个网址，看看到底发生了什么。');
                    } else if (t === 'like') {
                        setStatus('点赞模式：先点发送方电脑，再选择目标电脑，看看点赞能不能送到。');
                    }
                }
                
                function setStatus(msg) { els.status.innerHTML = msg; }
                function showToast(type, msg) {
                    els.toast.className = 'toast show ' + type;
                    els.toast.textContent = msg;
                    clearTimeout(showToast._t);
                    showToast._t = setTimeout(function () { els.toast.classList.remove('show'); }, 4200);
                }
                function setSteps(current) {
                    document.querySelectorAll('.step').forEach(function (s) {
                        var n = Number(s.dataset.step);
                        s.classList.remove('active', 'done');
                        if (n < current) s.classList.add('done');
                        else if (n === current) s.classList.add('active');
                    });
                }
                
                /* ===== 场景 ===== */
                function clearDeviceDom() {
                    els.stage.querySelectorAll('.dev').forEach(function (d) { d.remove(); });
                    els.stage.querySelectorAll('.port-label').forEach(function (d) { d.remove(); });
                }
                
                function clearScene() {
                    state.devices = []; state.links = []; state.connectFrom = null;
                    state.nextId = 1; state.sendRunning = false;
                    state.selection = []; state.selectedLinkId = null;
                    clearOverlays(); clearDeviceDom(); renderAll();
                    setStatus('画布已清空：先从设备库拖设备搭建网络。');
                }
                
                function loadBuildScene() {
                    state.devices = []; state.links = []; state.connectFrom = null;
                    state.nextId = 1; state.sendRunning = false;
                    state.selection = []; state.selectedLinkId = null;
                    clearOverlays(); clearDeviceDom(); renderAll();
                    setStatus('空白画布：先从设备库拖"区域框"划分区域，再拖设备搭建你的网络。');
                    showToast('info', '空白画布已就绪，开始搭建吧！');
                }
                
                function loadCommScene() {
                    state.devices = []; state.links = []; state.connectFrom = null;
                    state.nextId = 1; state.sendRunning = false;
                    state.selection = []; state.selectedLinkId = null;
                    clearOverlays(); clearDeviceDom(); renderAll();
                    setStatus('通信模式：搭建网络 → 双击电脑设置编号 → 用"点赞"工具测试数据能否送达。路由器连线后自动分配接口号。');
                    showToast('info', '通信模式：先搭网络，再给电脑编号，然后发点赞测试！');
                }
                
                /* ===== 画布事件（点击/双击/框选/右键） ===== */
                function bindStage() {
                    var isSelecting = false;
                    var selStart = { x: 0, y: 0 };
                    var justRubberBand = false;
                    
                    els.stage.addEventListener('pointerdown', function (e) {
                        if (e.target.closest('.dev') || e.target.closest('.resize-handle')) return;
                        if (state.tool !== 'select' || state.mode === 'demo') return;
                        if (e.button !== 0) return;
                        var rect = els.stage.getBoundingClientRect();
                        isSelecting = true;
                        selStart.x = e.clientX - rect.left;
                        selStart.y = e.clientY - rect.top;
                        els.selectionBox.style.display = 'block';
                        els.selectionBox.style.left = selStart.x + 'px';
                        els.selectionBox.style.top = selStart.y + 'px';
                        els.selectionBox.style.width = '0px';
                        els.selectionBox.style.height = '0px';
                        state.selection = [];
                        document.querySelectorAll('.dev').forEach(function (d) { d.classList.remove('selected'); });
                    });
                    
                    document.addEventListener('pointermove', function (e) {
                        if (!isSelecting) return;
                        var rect = els.stage.getBoundingClientRect();
                        var cx = e.clientX - rect.left;
                        var cy = e.clientY - rect.top;
                        var x = Math.min(selStart.x, cx);
                        var y = Math.min(selStart.y, cy);
                        var w = Math.abs(cx - selStart.x);
                        var h = Math.abs(cy - selStart.y);
                        els.selectionBox.style.left = x + 'px';
                        els.selectionBox.style.top = y + 'px';
                        els.selectionBox.style.width = w + 'px';
                        els.selectionBox.style.height = h + 'px';
                    });
                    
                    document.addEventListener('pointerup', function (e) {
                        if (!isSelecting) return;
                        isSelecting = false;
                        var box = els.selectionBox.getBoundingClientRect();
                        var stageRect = els.stage.getBoundingClientRect();
                        var bx = box.left - stageRect.left;
                        var by = box.top - stageRect.top;
                        var bw = box.width;
                        var bh = box.height;
                        els.selectionBox.style.display = 'none';
                        if (bw < 5 || bh < 5) return;
                        state.devices.forEach(function (d) {
                            if (d.x >= bx && d.x <= bx + bw && d.y >= by && d.y <= by + bh) {
                                state.selection.push(d.id);
                            }
                        });
                        state.selection.forEach(function (id) {
                            var el = els.stage.querySelector('.dev[data-id="' + id + '"]');
                            if (el) el.classList.add('selected');
                        });
                        if (state.selection.length > 0) {
                            justRubberBand = true;
                            setStatus('已选中 ' + state.selection.length + ' 个设备，拖动其中一个可集体移动；按 Delete 删除。');
                        }
                    });
                    
                    /* 单击 */
                    els.stage.addEventListener('click', function (e) {
                        if (justRubberBand) { justRubberBand = false; return; }
                        var pencilEl = e.target.closest('.edit-pencil');
                        if (pencilEl) {
                            var pDevEl = pencilEl.closest('.dev');
                            if (pDevEl) {
                                e.stopPropagation();
                                var pid = Number(pDevEl.dataset.id);
                                var pdev = getDev(pid);
                                if (pdev && state.mode !== 'demo') {
                                    if (pdev.type === 'zone') {
                                        var zn = window.prompt('给这个区域起个名字（如：机房区域、家庭区域）：', pdev.label || '区域');
                                        if (zn && zn.trim()) { pdev.label = zn.trim(); renderAll(); }
                                    } else if (state.mode === 'comm' && pdev.type === 'pc') {
                                        var ad = window.prompt('给这台电脑设置编号（格式：网络号.主机号，如 1.10）：', pdev.addr || '');
                                        if (ad !== null) { pdev.addr = ad.trim(); renderAll(); }
                                    } else {
                                        var lb = window.prompt('修改设备名称：', pdev.label || DEVICES[pdev.type].name);
                                        if (lb !== null && lb.trim()) { pdev.label = lb.trim(); renderAll(); }
                                    }
                                }
                            }
                            return;
                        }
                        var devEl = e.target.closest('.dev');
                        if (devEl) { handleDevClick(Number(devEl.dataset.id), e); return; }
                        /* 点击空白 */
                        state.selection = [];
                        state.selectedLinkId = null;
                        document.querySelectorAll('.dev').forEach(function (d) { d.classList.remove('selected'); });
                        document.querySelectorAll('svg.links line').forEach(function (l) { l.classList.remove('selected'); });
                        if (state.connectFrom) state.connectFrom = null;
                    });
                    
                    /* 双击改名（所有设备） */
                    els.stage.addEventListener('dblclick', function (e) {
                        var devEl = e.target.closest('.dev');
                        if (!devEl) return;
                        var dev = getDev(Number(devEl.dataset.id));
                        if (!dev) return;
                        if (state.mode === 'demo') return;
                        if (dev.type === 'zone') {
                            var name = window.prompt('给这个区域起个名字（如：机房区域、家庭区域）：', dev.label || '区域');
                            if (name && name.trim()) {
                                dev.label = name.trim();
                                var tag = devEl.querySelector('.zone-tag');
                                if (tag) tag.textContent = dev.label;
                                showToast('ok', '区域已命名为「' + dev.label + '」。');
                            }
                        } else if (state.mode === 'comm' && dev.type === 'pc') {
                            var addr = window.prompt('给这台电脑设置编号（格式：网络号.主机号，如 1.10）：\n\n提示：同一网络里的电脑网络号相同、主机号不同。', dev.addr || '');
                            if (addr !== null) {
                                dev.addr = addr.trim();
                                renderAll();
                                showToast('ok', '电脑编号已设置为「' + dev.addr + '」。');
                            }
                        } else {
                            var label = window.prompt('修改设备名称：', dev.label || DEVICES[dev.type].name);
                            if (label !== null && label.trim()) {
                                dev.label = label.trim();
                                renderAll();
                                showToast('ok', '设备已改名为「' + dev.label + '」。');
                            }
                        }
                    });
                    
                    /* 右键弹出菜单 */
                    var ctxTarget = null; /* {type:'dev'|'link', id} */
                    els.stage.addEventListener('contextmenu', function (e) {
                        e.preventDefault();
                        if (state.mode === 'demo') return;
                        hideCtxMenu();
                        var devEl = e.target.closest('.dev');
                        var linkHit = e.target.closest('[data-link]');
                        if (devEl) {
                            var id = Number(devEl.dataset.id);
                            ctxTarget = { type: 'dev', id: id };
                            els.ctxEdit.style.display = '';
                        } else if (linkHit) {
                            var lid = Number(linkHit.getAttribute('data-link'));
                            ctxTarget = { type: 'link', id: lid };
                            els.ctxEdit.style.display = 'none';
                        } else {
                            return;
                        }
                        var rect = els.stage.getBoundingClientRect();
                        els.ctxMenu.style.left = (e.clientX - rect.left) + 'px';
                        els.ctxMenu.style.top = (e.clientY - rect.top) + 'px';
                        els.ctxMenu.classList.add('show');
                    });
                    
                    /* 右键菜单：编辑名称 */
                    els.ctxEdit.addEventListener('click', function () {
                        if (!ctxTarget || ctxTarget.type !== 'dev') return;
                        var dev = getDev(ctxTarget.id);
                        if (!dev) return;
                        if (dev.type === 'zone') {
                            var zn = window.prompt('给这个区域起个名字：', dev.label || '区域');
                            if (zn && zn.trim()) { dev.label = zn.trim(); renderAll(); }
                        } else if (state.mode === 'comm' && dev.type === 'pc') {
                            var ad = window.prompt('设置编号（网络号.主机号，如 1.10）：', dev.addr || '');
                            if (ad !== null) { dev.addr = ad.trim(); renderAll(); }
                        } else {
                            var lb = window.prompt('修改设备名称：', dev.label || DEVICES[dev.type].name);
                            if (lb !== null && lb.trim()) { dev.label = lb.trim(); renderAll(); }
                        }
                        hideCtxMenu();
                        ctxTarget = null;
                    });
                    
                    els.ctxDelete.addEventListener('click', function () {
                        if (!ctxTarget) return;
                        if (ctxTarget.type === 'dev') {
                            var d = getDev(ctxTarget.id);
                            var tn = d ? DEVICES[d.type].name : '设备';
                            removeDev(ctxTarget.id);
                            showToast('info', '已删除【' + tn + '】。');
                        } else if (ctxTarget.type === 'link') {
                            removeLink(ctxTarget.id);
                            showToast('info', '已删除连线。');
                        }
                        ctxTarget = null;
                        hideCtxMenu();
                    });
                    document.addEventListener('pointerdown', function (e) {
                        if (!e.target.closest('.ctx-menu')) hideCtxMenu();
                    });
                }
                
                function hideCtxMenu() {
                    if (els.ctxMenu) els.ctxMenu.classList.remove('show');
                }
                
                /* 选中连线 */
                function selectLink(lid) {
                    state.selectedLinkId = lid;
                    state.selection = [];
                    document.querySelectorAll('.dev').forEach(function (d) { d.classList.remove('selected'); });
                    document.querySelectorAll('svg.links line').forEach(function (l) { l.classList.remove('selected'); });
                    var line = els.linksSvg.querySelector('line[data-link="' + lid + '"]');
                    if (line) line.classList.add('selected');
                    var link = getLink(lid);
                    if (link) {
                        var a = getDev(link.a), b = getDev(link.b);
                        var kindName = link.kind === 'wifi' ? 'WiFi' : link.kind === 'fiber' ? '光纤' : '网线';
                        setStatus('选中连线：' + DEVICES[a.type].name + ' ↔ ' + DEVICES[b.type].name + '（' + kindName + '）。按 Delete 或右键可删除。');
                    }
                }
                
                /* ===== 键盘删除 ===== */
                function bindKeyboard() {
                    document.addEventListener('keydown', function (e) {
                        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                        if (state.mode === 'demo') return;
                        if (e.key === 'Backspace' || e.key === 'Delete') {
                            if (state.selection.length > 0) {
                                e.preventDefault();
                                var ids = state.selection.slice();
                                ids.forEach(function (id) { removeDev(id); });
                                state.selection = [];
                                showToast('info', '已删除选中的 ' + ids.length + ' 个设备。');
                            } else if (state.selectedLinkId !== null) {
                                e.preventDefault();
                                removeLink(state.selectedLinkId);
                                state.selectedLinkId = null;
                                showToast('info', '已删除选中的连线。');
                            }
                        }
                    });
                }
                
                function handleDevClick(id, e) {
                    var dev = getDev(id);
                    if (!dev) return;
                    if (state.mode === 'demo') {
                        if (state.demoPlaying) return;
                        var d = DEVICES[dev.type];
                        var ipInfo = dev.ip ? ('  IP：' + dev.ip) : (dev.addr ? ('  编号：' + dev.addr) : '');
                        setStatus('【' + (dev.label || d.name) + '】：' + d.desc + ipInfo + '。');
                        return;
                    }
                    if (state.tool === 'connect') {
                        if (!state.connectFrom) {
                            state.connectFrom = id;
                            e.target.closest('.dev').classList.add('selected');
                            setStatus('再点另一台设备，把它和【' + (getDev(id).label || DEVICES[dev.type].name) + '】连起来。');
                        } else if (state.connectFrom === id) {
                            state.connectFrom = null;
                            e.target.closest('.dev').classList.remove('selected');
                            setStatus('连线模式：先点一台设备，再点另一台设备。');
                        } else {
                            var fromEl = els.stage.querySelector('.dev[data-id="' + state.connectFrom + '"]');
                            if (fromEl) fromEl.classList.remove('selected');
                            addLink(state.connectFrom, id);
                            state.connectFrom = null;
                        }
                        return;
                    }
                    if (state.tool === 'send') {
                        if (dev.type !== 'pc' && dev.type !== 'phone' && dev.type !== 'tablet') {
                            showToast('info', '上网要从电脑 / 手机 / 平板开始，请点一个终端设备。'); return;
                        }
                        openSitePanel(id); return;
                    }
                    if (state.tool === 'like') {
                        if (dev.type !== 'pc') {
                            showToast('info', '点赞要从电脑开始，请点一台电脑。'); return;
                        }
                        openTargetPanel(id); return;
                    }
                    /* select 模式 */
                    if (state.selection.indexOf(id) !== -1 && state.selection.length > 1) {
                        /* 已在多选组中，不改变选中，拖动时会集体移动 */
                        return;
                    }
                    state.selection = [id];
                    state.selectedLinkId = null;
                    document.querySelectorAll('.dev').forEach(function (d) { d.classList.remove('selected'); });
                    document.querySelectorAll('svg.links line').forEach(function (l) { l.classList.remove('selected'); });
                    e.target.closest('.dev').classList.add('selected');
                    if (dev.type === 'zone') {
                        setStatus('区域框「' + (dev.label || '区域') + '」：拖动可移动，双击改名，拖右下角缩放。');
                        return;
                    }
                    var info = dev.ip ? ('  IP：' + dev.ip) : (dev.addr ? ('  编号：' + dev.addr) : '');
                    setStatus('【' + (dev.label || DEVICES[dev.type].name) + '】：' + DEVICES[dev.type].desc + info + '。双击可改名。');
                }
                
                /* ===== 网址/目标面板 ===== */
                function openSitePanel(pcId) {
                    if (state.sendRunning) return;
                    pendingPcId = pcId;
                    els.sitePanel.classList.add('show');
                }
                function closeSitePanel() { els.sitePanel.classList.remove('show'); pendingPcId = null; }
                
                function openTargetPanel(pcId) {
                    if (state.sendRunning) return;
                    pendingPcId = pcId;
                    var pcs = state.devices.filter(function (d) { return d.type === 'pc' && d.id !== pcId; });
                    els.targetList.innerHTML = '';
                    if (pcs.length === 0) {
                        els.targetList.innerHTML = '<p style="color:var(--muted);font-size:13px;">画布上还没有其他电脑</p>';
                    }
                    pcs.forEach(function (p) {
                        var btn = document.createElement('button');
                        btn.className = 'site-btn';
                        var addr = p.addr ? '（编号：' + p.addr + '）' : '（未设置编号）';
                        btn.innerHTML = '<span class="s-name">' + (p.label || '电脑') + '</span><span class="s-url">' + addr + '</span>';
                        btn.addEventListener('click', function () {
                            closeTargetPanel();
                            startLikeSend(pcId, p.id);
                        });
                        els.targetList.appendChild(btn);
                    });
                    els.targetPanel.classList.add('show');
                }
                function closeTargetPanel() { els.targetPanel.classList.remove('show'); pendingPcId = null; }
                
                /* ===== 设备/连线操作 ===== */
                function getDev(id) {
                    for (var i = 0; i < state.devices.length; i++) {
                        if (state.devices[i].id === id) return state.devices[i];
                    }
                    return null;
                }
                function getLink(id) {
                    for (var i = 0; i < state.links.length; i++) {
                        if (state.links[i].id === id) return state.links[i];
                    }
                    return null;
                }
                function getDevByType(t) {
                    for (var i = 0; i < state.devices.length; i++) {
                        if (state.devices[i].type === t) return state.devices[i];
                    }
                    return null;
                }
                
                function addLink(aId, bId) {
                    if (aId === bId) return;
                    var da = getDev(aId), db = getDev(bId);
                    if (!da || !db) return;
                    if (da.type === 'zone' || db.type === 'zone') {
                        showToast('info', '区域框只是用来划分区域的，不能连线。'); return;
                    }
                    var dup = state.links.some(function (l) {
                        return (l.a === aId && l.b === bId) || (l.a === bId && l.b === aId);
                    });
                    if (dup) { showToast('info', '这两个设备已经连过了。'); return; }
                    var newLink = { id: state.nextId++, a: aId, b: bId, kind: 'wire', portA: 0, portB: 0 };
                    /* 通信模式：路由器自动分配接口号 */
                    if (state.mode === 'comm') {
                        if (da.type === 'router') newLink.portA = getNextRouterPort(da.id);
                        if (db.type === 'router') newLink.portB = getNextRouterPort(db.id);
                    }
                    state.links.push(newLink);
                    /* 搭建模式：弹出介质选择 */

                        var id = Number(devEl.dataset.id);
                        var dev = getDev(id);

                        /* 确定要移动的设备集合 */

                            moveIds = state.selection.slice();

                            moveIds = [id];
                            state.selection = [id];
                            document.querySelectorAll('.dev').forEach(function (d) { d.classList.remove('selected'); });
                            devEl.classList.add('selected');
                        }
                        
                        var origPositions = {};
                        moveIds.forEach(function (mid) {
                            var md = getDev(mid);
                            if (md) origPositions[mid] = { x: md.x, y: md.y };
                        });
                        
                        devEl.classList.add('dragging');
                        var rect = els.stage.getBoundingClientRect();
                        var startX = e.clientX, startY = e.clientY;
                        
                        function onMove(ev) {
                            var dx = ev.clientX - startX;
                            var dy = ev.clientY - startY;
                            moveIds.forEach(function (mid) {
                                var md = getDev(mid);
                                if (!md) return;
                                var nx = origPositions[mid].x + dx;
                                var ny = origPositions[mid].y + dy;
                                nx = Math.max(24, Math.min(rect.width - 24, nx));
                                ny = Math.max(24, Math.min(rect.height - 24, ny));
                                md.x = Math.round(nx);
                                md.y = Math.round(ny);

                            });
                            updateLinkEnds();
                            renderPortLabels();
                        }
                        function onUp() {
                            document.removeEventListener('pointermove', onMove);
                            document.removeEventListener('pointerup', onUp);
                            devEl.classList.remove('dragging');
                        }
                        document.addEventListener('pointermove', onMove);
                        document.addEventListener('pointerup', onUp);
                    });
                }

                        var startW = dev.w || 340, startH = dev.h || 260;
                        var left = dev.x - startW / 2, top = dev.y - startH / 2;
                        function onMove(ev) {
                            var nw = startW + (ev.clientX - startX);
                            var nh = startH + (ev.clientY - startY);

                            nh = Math.max(90, Math.min(1000, nh));
                            dev.w = Math.round(nw); dev.h = Math.round(nh);

                            devEl.style.left = dev.x + 'px';
                            devEl.style.top = dev.y + 'px';

                        function onUp() {
                            document.removeEventListener('pointermove', onMove);
                            document.removeEventListener('pointerup', onUp);
                            document.removeEventListener('pointercancel', onUp);

                function bubbleOverlaps(x, y) {
                    var bw = els.bubble.offsetWidth, bh = els.bubble.offsetHeight;
                    var r = x + bw, b = y + bh;
                    for (var i = 0; i < state.devices.length; i++) {
                        var d = state.devices[i];
                        if (!(d.x + 46 < x || d.x - 46 > r || d.y + 45 < y || d.y - 45 > b)) return true;
                    }
                    return false;
                }
                function bubbleScanY(yBase, cx, below) {
                    var bw = els.bubble.offsetWidth, bh = els.bubble.offsetHeight;
                    var stageRect = els.stage.getBoundingClientRect();
                    var W = stageRect.width, H = stageRect.height;
                    var yy = Math.max(8, Math.min(H - bh - 8, yBase));
                    if (yy < 8 || yy + bh > H - 8) return null;
                    for (var off = 0; off <= 280; off += 10) {
                        var xs = [cx + off, cx - off];
                        for (var j = 0; j < 2; j++) {
                            var xx = Math.max(8, Math.min(W - bw - 8, xs[j]));
                            if (xx < 8 || xx + bw > W - 8) continue;
                            if (!bubbleOverlaps(xx, yy)) return { x: xx, y: yy, below: below };
                        }
                    }
                    return null;

                    var chosen = null;
                    if (!forceBelow) chosen = bubbleScanY(dev.y - bh - 55, cx, false);
                    if (!chosen) chosen = bubbleScanY(dev.y + 55, cx, true);
                    if (!chosen) chosen = { x: cx, y: Math.max(8, Math.min(H - bh - 8, dev.y - bh - 55)), below: false };
                    if (chosen.below) els.bubble.classList.add('below');
