                /* ===== 上网全流程（搭建模式） ===== */
                /* 上网前检查连接规则 */
                function validateNetwork() {
                    var errors = [];
                    var getLinksOf = function(devId) {
                        return state.links.filter(function(l) { return l.a === devId || l.b === devId; });
                    };
                    var otherEnd = function(link, devId) {
                        return link.a === devId ? link.b : link.a;
                    };
                    var typeOf = function(devId) { var d = getDev(devId); return d ? d.type : null; };
                    var isWirelessType = function(t) { return t === 'phone' || t === 'tablet'; };
                    
                    state.devices.forEach(function(dev) {
                        var links = getLinksOf(dev.id);
                        links.forEach(function(l) {
                            var otherType = typeOf(otherEnd(l, dev.id));
                            /* 光纤只能光猫↔互联网 */
                            if (l.kind === 'fiber') {
                                var pair = [dev.type, otherType].sort().join(',');
                                if (pair !== 'internet,modem') {
                                    errors.push('光纤只能连接光猫和互联网，现在是' + DEVICES[dev.type].name + '和' + (otherType ? DEVICES[otherType].name : '?') + '之间用了光纤。');
                                }
                            }
                            /* 手机/平板不能网线连接 */
                            if (l.kind === 'wire' && (isWirelessType(dev.type) || isWirelessType(otherType))) {
                                var wireOther = isWirelessType(dev.type) ? otherType : dev.type;
                                errors.push('手机/平板不能用网线连接，应该通过WiFi连到无线AP。');
                            }
                            /* 互联网不能网线连接 */
                            if (l.kind === 'wire' && (dev.type === 'internet' || otherType === 'internet')) {
                                errors.push('互联网必须通过光纤连接光猫，不能直接连网线。');
                            }
                            /* WiFi必须连AP */
                            if (l.kind === 'wifi' && dev.type !== 'ap' && otherType !== 'ap') {
                                errors.push('WiFi必须连到无线AP，现在' + DEVICES[dev.type].name + '直接用WiFi连了' + (otherType ? DEVICES[otherType].name : '?') + '。');
                            }
                            /* WiFi不能连互联网 */
                            if (l.kind === 'wifi' && (dev.type === 'internet' || otherType === 'internet')) {
                                errors.push('互联网不能用WiFi连接。');
                            }
                        });
                    });
                    
                    /* 路由器LAN口限制 */
                    state.devices.forEach(function(dev) {
                        if (dev.type !== 'router') return;
                        var lanCount = 0;
                        getLinksOf(dev.id).forEach(function(l) {
                            var oType = typeOf(otherEnd(l, dev.id));
                            if (oType && oType !== 'modem' && l.kind !== 'wifi') lanCount++;
                        });
                        if (lanCount > 3) {
                            errors.push('路由器接了' + lanCount + '个本地设备，LAN口最多3个，需要减少一个。');
                        }
                    });
                    
                    /* 去重 */
                    var unique = [];
                    errors.forEach(function(e) { if (unique.indexOf(e) === -1) unique.push(e); });
                    return unique;
                }
                
                function startVisit(site) {
                    if (state.sendRunning || pendingPcId === null) return;
                    var pcId = pendingPcId;
                    closeSitePanel();
                    var pcDev = getDev(pcId);
                    if (!pcDev) return;
                    
                    /* 先检查连接规则 */
                    var ruleErrors = validateNetwork();
                    if (ruleErrors.length > 0) {
                        showToast('bad', '网络有问题：' + ruleErrors[0]);
                        setStatus('网络检查发现问题：' + ruleErrors[0] + (ruleErrors.length > 1 ? '（共' + ruleErrors.length + '个问题）' : ''));
                        return;
                    }
                    
                    var path = findPath(pcId);
                    if (path === null) {
                        var reachable = getReachable(pcId);
                        showToast('bad', analyzeBlock(reachable));
                        return;
                    }
                    state.sendRunning = true;
                    setTool('select');
                    showNote('在浏览器输入网址：<b>' + site.url + '</b>，看看数据经过哪些设备');
                    setTimeout(function () {
                        hideNote();
                        animateHops(pcId, site, function () {
                            var serverDev = getDev(path[path.length - 1]);
                            if (serverDev) showBubble(serverDev, '数据到达<b>' + site.name + '</b>！网页开始加载。', 2500);

                /* 通信模式路径查找：基于编号网络号自动路由 */
                function findCommPath(fromId, toId) {
                    var fromDev = getDev(fromId), toDev = getDev(toId);
                    var fromAddr = parseAddr(fromDev.addr), toAddr = parseAddr(toDev.addr);
                    if (!fromAddr || !toAddr) return null;
                    
                    var adj = buildAdj();
                    var sameNet = fromAddr.net === toAddr.net;
                    
                    if (sameNet) {
                        /* 同一网络：源 → 交换机 → 目标（如果有交换机直连） */
                        var fromSw = findConnected(fromId, 'switch', adj);
                        var toSw = findConnected(toId, 'switch', adj);
                        if (fromSw && toSw && fromSw === toSw) {
                            return [fromId, fromSw, toId];
                        }
                        /* 直连 */
                        if (adj[fromId].indexOf(toId) !== -1) return [fromId, toId];
                        return null;
                    }
                    
                    /* 不同网络：源 → 交换机 → 路由器 → 交换机 → 目标 */
                    var fromSwitch = findConnected(fromId, 'switch', adj);
                    var toSwitch = findConnected(toId, 'switch', adj);
                    if (!fromSwitch || !toSwitch) return null;
                    
                    /* 找连接两个交换机的路由器 */
                    var fromRouters = (adj[fromSwitch] || []).filter(function (id) { return getDev(id).type === 'router'; });
                    var toRouters = (adj[toSwitch] || []).filter(function (id) { return getDev(id).type === 'router'; });
                    var commonRouter = null;
                    for (var i = 0; i < fromRouters.length; i++) {
                        if (toRouters.indexOf(fromRouters[i]) !== -1) { commonRouter = fromRouters[i]; break; }
                    }
                    if (!commonRouter) {
                        /* 尝试通过多跳路由器（简化：BFS找路由器间路径） */
                        var routerPath = findRouterPath(fromSwitch, toSwitch, adj);
                        if (routerPath) {
                            return [fromId, fromSwitch].concat(routerPath).concat([toSwitch, toId]);
                        }
                        return null;
                    }
                    return [fromId, fromSwitch, commonRouter, toSwitch, toId];
                }
                
                function findConnected(devId, type, adj) {
                    var neighbors = adj[devId] || [];
                    for (var i = 0; i < neighbors.length; i++) {
                        if (getDev(neighbors[i]).type === type) return neighbors[i];
                    }
                    return null;
                }
                
                function findRouterPath(fromSw, toSw, adj) {
                    /* BFS from fromSw through routers to toSw */
                    var queue = [[fromSw]], visited = {};
                    visited[fromSw] = true;

                        var cur = path[path.length - 1];

                    else if (s === 5) { setSteps(4); flashDev(rt); showRtPanel(rt, 'baidu'); showBubble(rt, '到了<b>路由器</b>！查<b>路由表</b>：匹配百度服务器，走互联网出口！'); setStatus('第5步：路由器查路由表找路。'); }
                    else if (s === 6) { setSteps(5); flashDev(baidu); showBubble(baidu, '数据包到达<b>百度服务器</b>！'); setStatus('第6步：到达服务器。'); }
                    else if (s === 7) { setSteps(6); flashDev(baidu); showBubble(baidu, '百度服务器把网页打包成<b>回程数据包</b>，按原路寄回。'); setStatus('第7步：服务器回传网页数据。'); }
                    else if (s === 8) { setSteps(6); flashDev(pc); showWebpage(); showBubble(pc, '回程数据包到达<b>小明的电脑</b>！浏览器显示出百度首页。'); setStatus('第8步：网页数据回到小明电脑。'); }
                    else if (s === 9) { setSteps(0); hideBubble(); showToast('ok', '演示完成！'); setStatus('演示结束。'); }
                }
                
                function playDemoStep(s, done) {
                    var pc = getDevByType('pc'), sw = getDevByType('switch'), rt = getDevByType('router');
                    var modem = getDevByType('modem'), internet = getDevByType('internet');
                    var baidu = findDevByIp('110.242.68.66'), dnsSrv = getDevByType('dns');
                    if (s === 1 || s === 3 || s === 7 || s === 9) { displayDemoState(s); done(); return; }
                    if (s === 2) {
                        demoAnimatePath([pc.id, sw.id, rt.id, modem.id, internet.id, dnsSrv.id], function () {
                            flashDev(dnsSrv);
                            showBubble(dnsSrv, 'DNS查到：<b>www.baidu.com</b> → <b>110.242.68.66</b>，送回给小明。');
                            setTimeout(function () { hideBubble(); flashOff(dnsSrv); demoAnimatePath([dnsSrv.id, internet.id, modem.id, rt.id, sw.id, pc.id], function () { displayDemoState(2); done(); }); }, 1100);
                        });
                        return;
                    }
                    if (s === 4) { demoAnimatePath([pc.id, sw.id], function () { displayDemoState(4); done(); }); return; }
                    if (s === 5) { demoAnimatePath([sw.id, rt.id], function () { displayDemoState(5); done(); }); return; }
                    if (s === 6) { demoAnimatePath([rt.id, modem.id, internet.id, baidu.id], function () { displayDemoState(6); done(); }); return; }
                    if (s === 8) { demoAnimatePath([baidu.id, internet.id, modem.id, rt.id, sw.id, pc.id], function () { displayDemoState(8); done(); }); return; }
                    displayDemoState(s); done();
                }
                
                function startDemo() {
                    if (state.mode !== 'demo' || state.demoPlaying) return;
                    state.demoStep = 0; setTool('select');
                    clearOverlays(); hideRtPanel(); els.webpage.classList.remove('show');
                    els.btnNext.disabled = false; els.btnPrev.disabled = false;
                    showToast('info', '点"下一步"，一步步看寻址过程。');
                    nextDemoStep();
                }
                
                function nextDemoStep() {
                    if (state.mode !== 'demo' || state.demoPlaying) return;
                    if (state.demoStep >= 9) return;
                    state.demoStep++; state.demoPlaying = true;
                    els.btnNext.disabled = true; els.btnPrev.disabled = true;
                    hideBubble();
                    playDemoStep(state.demoStep, function () {
                        state.demoPlaying = false;
                        if (state.demoStep >= 9) els.btnNext.disabled = true;
                        else els.btnNext.disabled = false;
                        els.btnPrev.disabled = false;
                    });
                }
                
                function prevDemoStep() {
                    if (state.mode !== 'demo' || state.demoPlaying) return;
                    if (state.demoStep <= 1) return;
                    state.demoStep--;
                    els.btnNext.disabled = true; els.btnPrev.disabled = true;
                    hideBubble();
                    displayDemoState(state.demoStep);
                    els.btnNext.disabled = false; els.btnPrev.disabled = false;
                }
                
                function showWebpage() {
                    var stageRect = els.stage.getBoundingClientRect();
                    var W = stageRect.width, H = stageRect.height;
                    els.webpage.style.left = Math.max(12, Math.round(W / 2 - 150)) + 'px';
                    els.webpage.classList.add('show');
                    var wh = els.webpage.offsetHeight;
                    els.webpage.style.top = Math.max(12, Math.round(H / 2 - wh / 2)) + 'px';
                }
                
                /* ===== 启动 ===== */
                document.getElementById('btnNext') && (function () {
                    document.getElementById('btnNext').addEventListener('click', function () { nextDemoStep(); });
                })();
                document.getElementById('btnPrev') && (function () {
                    document.getElementById('btnPrev').addEventListener('click', function () { prevDemoStep(); });
                })();
                
                init();
                bindStageDrag();
            })();
            
            window.addEventListener('beforeunload', function (e) {
                e.preventDefault();
            });
        </script>
    </body>
</html>
